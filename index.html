<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestría AI × Psicología</title>
<meta name="description" content="Portafolio de maestrías en AI × psicología / ciencia cognitiva para entrada Fall 2028.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F45C8'/%3E%3Ccircle cx='12' cy='16' r='5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='20' cy='16' r='5' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: una sola columna de 1080px; resumen → calendario → portafolio (filas expandibles) → descartes → contexto. */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --fg: #15171C;
  --muted: #5B6170;
  --faint: #8A909C;
  --rule: #E1E3E8;
  --accent: #2F45C8;
  --accent-soft: #E7EAFB;
  --good: #1D7447;
  --good-soft: #E2F1E8;
  --warn: #8F5500;
  --warn-soft: #FAEFD9;
  --idle-soft: #ECEDF0;
  --alert: #A8261E;
  --alert-soft: #FBE8E6;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #161920; --fg: #E7E9EE; --muted: #A1A7B3; --faint: #737A88; --rule: #262A33;
    --accent: #8FA0FF; --accent-soft: #1D2344; --good: #5DC48F; --good-soft: #12291C; --warn: #E6AE52; --warn-soft: #2D2210;
    --idle-soft: #1F2229; --alert: #F08C82; --alert-soft: #331715; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #161920; --fg: #E7E9EE; --muted: #A1A7B3; --faint: #737A88; --rule: #262A33;
  --accent: #8FA0FF; --accent-soft: #1D2344; --good: #5DC48F; --good-soft: #12291C; --warn: #E6AE52; --warn-soft: #2D2210;
  --idle-soft: #1F2229; --alert: #F08C82; --alert-soft: #331715; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 15px/1.55 var(--font-body);
  padding-inline: 20px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 64px);
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 56px; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11.5px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
  margin-inline: -20px; padding: 12px 20px;
}
.topbar-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 20px; }
.brand { font: 650 15px/1 var(--font-display); color: var(--fg); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav a { color: var(--muted); text-decoration: none; font-size: 13.5px; white-space: nowrap; }
.nav a:hover { color: var(--fg); }
.theme-btn {
  border: 1px solid var(--rule); background: var(--surface); color: var(--muted);
  font: 500 12px/1 var(--font-mono); padding: 7px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.theme-btn:hover { color: var(--fg); }

/* Hero */
.hero { display: grid; gap: 18px; padding-top: 40px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.02; letter-spacing: -0.025em; max-width: 14ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 16px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--faint); font: 400 12.5px/1.4 var(--font-mono); }

.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.stat { padding: 16px 16px 16px 0; display: grid; gap: 6px; align-content: start; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--rule); }
.stat b { font: 500 26px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
@media (max-width: 820px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat:nth-child(4) { border-left: 0; padding-left: 0; }
  .stat:nth-child(n+4) { border-top: 1px solid var(--rule); }
}
@media (max-width: 480px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(4) { border-left: 1px solid var(--rule); padding-left: 16px; }
  .stat:nth-child(odd) { border-left: 0; padding-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
}

.alerts { display: grid; gap: 10px; }
.alert {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start;
  background: var(--alert-soft); color: var(--fg); border-radius: var(--radius); padding: 14px 16px; font-size: 14px;
}
.alert-tag { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--alert); border: 1px solid currentColor; border-radius: 999px; padding: 5px 8px; white-space: nowrap; }
.alert p { margin: 0; }

/* Sections */
section { display: grid; gap: 20px; scroll-margin-top: 72px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(22px, 3vw, 28px); }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }

/* Calendar */
.cal-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.cal { position: relative; min-width: 720px; height: 204px; margin: 0 24px; }
.cal .tick { position: absolute; top: 0; bottom: 30px; border-left: 1px solid var(--rule); }
.cal .tick span { position: absolute; bottom: -24px; left: 0; transform: translateX(-50%); font: 400 11px/1 var(--font-mono); color: var(--faint); white-space: nowrap; }
.cal .tick.year { border-left-color: color-mix(in srgb, var(--faint) 55%, transparent); }
.cal .tick.year span { color: var(--muted); font-weight: 500; }
.band { position: absolute; height: 26px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; }
.band.apply { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.band.study { background: var(--idle-soft); color: var(--muted); background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--faint) 18%, transparent) 6px 7px); }
.pin { position: absolute; display: grid; gap: 4px; justify-items: start; }
.pin i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); transform: translateX(-5px); }
.pin.risk i { background: var(--alert); }
.pin.goal i { background: var(--good); width: 12px; height: 12px; transform: translateX(-6px); }
.pin b { font-size: 12.5px; font-weight: 600; white-space: nowrap; transform: translateX(-5px); }
.pin small { font: 400 11px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; transform: translateX(-5px); }
.pin.flip { justify-items: end; }
.pin.flip i, .pin.flip b, .pin.flip small { transform: translateX(5px); }
.today { position: absolute; top: 0; bottom: 30px; border-left: 2px solid var(--fg); }
.today span { position: absolute; top: 8px; left: 6px; font: 500 11px/1 var(--font-mono); color: var(--fg); white-space: nowrap; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-body);
  padding: 8px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.seg button .num { font-size: 11px; color: var(--faint); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button[aria-pressed="true"] .num { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.field {
  border: 1px solid var(--rule); background: var(--surface); color: var(--fg); border-radius: 999px;
  font: 400 13.5px/1 var(--font-body); padding: 9px 14px; min-width: 0;
}
.field::placeholder { color: var(--faint); }
#q { flex: 1 1 220px; }
select.field { padding-right: 30px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

/* Program list */
.list { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.list-head, .prog > summary {
  display: grid; grid-template-columns: minmax(0, 1fr) 52px 56px 92px 128px 16px; gap: 16px; align-items: center; padding: 14px 18px;
}
.list-head { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--rule); padding-block: 12px; }
.prog + .prog { border-top: 1px solid var(--rule); }
.prog > summary { cursor: pointer; list-style: none; }
.prog > summary::-webkit-details-marker { display: none; }
.prog > summary:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.prog[open] > summary { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.p-name { min-width: 0; display: grid; gap: 3px; }
.p-name strong { font-weight: 600; font-size: 15px; line-height: 1.3; }
.p-name .inst { color: var(--muted); font-size: 12.5px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-name .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.tag { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.03em; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 5px; }
.tag.new { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.cc { font: 500 12.5px/1 var(--font-mono); color: var(--muted); }
.tier { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.tier.low { color: var(--faint); }
.meter { display: flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 2px; background: var(--idle-soft); box-shadow: inset 0 0 0 1px var(--rule); }
.meter i.on { background: var(--accent); box-shadow: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-body); padding: 6px 9px; border-radius: 999px; white-space: nowrap; justify-self: start; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.prioridad { background: var(--accent-soft); color: var(--accent); }
.pill.recomendado { background: var(--good-soft); color: var(--good); }
.pill.condicional { background: var(--warn-soft); color: var(--warn); }
.pill.descarte { background: var(--idle-soft); color: var(--muted); }
.chev { width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); margin-top: -4px; transition: transform .15s ease; }
.prog[open] .chev { transform: rotate(-135deg); margin-top: 4px; }
.p-body { padding: 4px 18px 22px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px 32px; }
.p-body dl { margin: 0; display: grid; gap: 14px; align-content: start; }
.p-body dt { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
.p-body dd { margin: 0; font-size: 14px; color: var(--fg); max-width: 62ch; }
.facts { border-left: 1px solid var(--rule); padding-left: 24px; }
.facts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 13.5px; }
.facts li { color: var(--fg); }
.facts .none { color: var(--faint); font-size: 13.5px; margin: 0; }
.empty { padding: 32px 18px; text-align: center; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; max-width: 80ch; margin: 0; }
.note strong { color: var(--fg); font-weight: 500; }

@media (max-width: 760px) {
  .list-head { display: none; }
  .prog > summary { grid-template-columns: minmax(0, 1fr) 16px; grid-template-areas: "name chev" "row row"; gap: 10px; }
  .prog > summary .p-name { grid-area: name; }
  .prog > summary .chev { grid-area: chev; align-self: start; margin-top: 6px; }
  .prog > summary .row { grid-area: row; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .p-name .inst { white-space: normal; }
  .p-body { grid-template-columns: minmax(0, 1fr); }
  .facts { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; }
}
@media (min-width: 761px) { .prog > summary .row { display: contents; } }

/* Discards */
.groups { display: grid; gap: 10px; }
.group { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary h3 { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.group > summary .num { color: var(--muted); font-size: 13px; }
.group[open] .chev { transform: rotate(-135deg); margin-top: 4px; }
.group ul { list-style: none; margin: 0; padding: 0 18px 10px; }
.group li { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 20px; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
.group li .d-name { font-weight: 600; }
.group li .d-meta { display: block; font-weight: 400; color: var(--faint); font-size: 12px; margin-top: 2px; }
.group li .d-why { color: var(--muted); }
@media (max-width: 640px) { .group li { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* Context */
.ctx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ctx article { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px 24px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.ctx article.wide { grid-column: 1 / -1; }
.ctx h3 { font-size: 18px; }
.ctx h4 { margin: 8px 0 0; font: 600 13px/1.3 var(--font-body); }
.ctx p, .ctx li { font-size: 14px; color: var(--fg); }
.ctx p { margin: 0; max-width: 68ch; }
.ctx ul, .ctx ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ctx blockquote { margin: 0; padding: 10px 14px; background: var(--accent-soft); border-radius: 8px; font-size: 13.5px; }
.ctx blockquote p { margin: 0; }
@media (max-width: 760px) { .ctx { grid-template-columns: minmax(0, 1fr); } }

.becas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.becas div { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; font-size: 13.5px; min-width: 0; }

footer { color: var(--faint); font-size: 12.5px; border-top: 1px solid var(--rule); padding-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

.loading { color: var(--muted); padding: 60px 0; }
.error { background: var(--alert-soft); padding: 16px 18px; border-radius: var(--radius); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">AI <span>×</span> Psicología</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#calendario">Calendario</a>
      <a href="#portafolio">Portafolio</a>
      <a href="#descartes">Descartes</a>
      <a href="#becas">Becas</a>
      <a href="#contexto">Contexto</a>
    </nav>
    <button class="theme-btn" id="theme" type="button" aria-label="Cambiar tema">Tema: auto</button>
  </div>
</header>

<main class="wrap" id="top">
  <div id="app" class="loading">Cargando el documento de contexto…</div>
</main>

<script>
(function () {
  const SOURCE = "contexto-maestria-ai-psicologia.md";
  const REPO = "https://github.com/SantiagoLlag/maestria-busqueda";
  const app = document.getElementById("app");

  // Tema: auto → claro → oscuro
  const themeBtn = document.getElementById("theme");
  const THEMES = ["auto", "light", "dark"];
  const THEME_LABEL = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = THEME_LABEL[t];
  }
  let theme = "auto";
  try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
  if (!THEMES.includes(theme)) theme = "auto";
  applyTheme(theme);
  themeBtn.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  });

  // ---------- Markdown helpers ----------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function inline(src) {
    const keep = [];
    const stash = (html) => "\u0000" + (keep.push(html) - 1) + "\u0000";
    let s = esc(src);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) =>
      /^https?:/.test(href) ? stash('<a href="' + href + '" target="_blank" rel="noopener">' + text + "</a>") : text);
    s = s.replace(/https?:\/\/[^\s<]+/g, (url) => {
      const trail = (url.match(/[).,;:]+$/) || [""])[0];
      const clean = url.slice(0, url.length - trail.length);
      let label = clean.replace(/^https?:\/\/(www\.)?/, "");
      if (label.length > 48) label = label.slice(0, 46) + "…";
      return stash('<a href="' + clean + '" target="_blank" rel="noopener">' + label + "</a>") + trail;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[+i]);
  }
  const plain = (s) => s.replace(/\*\*/g, "").replace(/`/g, "").trim();

  function blocks(md) {
    const out = [];
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push("<" + list.tag + ">" + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + "</" + list.tag + ">"); list = null; } };
    for (const raw of md.split("\n")) {
      const line = raw.trimEnd();
      const t = line.trim();
      let m;
      if (!t || t === "---") { flushPara(); flushList(); continue; }
      if ((m = t.match(/^#{3,4}\s+(.*)/))) { flushPara(); flushList(); out.push("<h4>" + inline(m[1]) + "</h4>"); continue; }
      if (t.startsWith(">")) { flushPara(); flushList(); out.push("<blockquote><p>" + inline(t.replace(/^>\s?/, "")) + "</p></blockquote>"); continue; }
      if ((m = t.match(/^[-*]\s+(.*)/)) || (m = t.match(/^\d+\.\s+(.*)/))) {
        flushPara();
        const tag = /^\d+\./.test(t) && !/^\s/.test(line) ? "ol" : "ul";
        if (!list || (list.tag !== tag && !/^\s/.test(line))) { flushList(); list = { tag, items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      if (list && /^\s/.test(line)) { list.items[list.items.length - 1] += " " + t; continue; }
      flushList(); para.push(t);
    }
    flushPara(); flushList();
    return out.join("");
  }

  function sections(md) {
    const map = {};
    md.split(/^## /m).slice(1).forEach((chunk) => {
      const nl = chunk.indexOf("\n");
      const title = chunk.slice(0, nl).trim();
      const num = (title.match(/^(\d+)\./) || [])[1];
      map[num || title] = { title: title.replace(/^\d+\.\s*/, ""), body: chunk.slice(nl + 1) };
    });
    return map;
  }

  // ---------- Parse programs ----------
  const CC = { "Francia": "FR", "Italia": "IT", "Reino Unido": "UK", "Países Bajos": "NL", "EUA": "US", "Alemania": "DE", "Suiza": "CH", "Canadá": "CA" };
  const STATUS = {
    prioridad: { label: "Prioridad", order: 0 },
    recomendado: { label: "Recomendado", order: 1 },
    condicional: { label: "Condicional", order: 2 },
    descarte: { label: "Descarte probable", order: 3 },
  };
  const norm = (s) => plain(s).toLowerCase().replace(/\([^)]*\)/g, "").replace(/[—–-]/g, " ").replace(/[^a-z0-9áéíóúüñ ]/gi, " ").replace(/\s+/g, " ").trim();

  function parseTable(body) {
    const rows = body.split("\n").filter((l) => l.trim().startsWith("|"));
    return rows.slice(2).map((row) => {
      const c = row.trim().replace(/^\||\|$/g, "").split("|").map((x) => x.trim());
      const [nameCell, country, tierRaw, lang, fitCell, admCell, noteCell] = c;
      const name = (nameCell.match(/\*\*(.+?)\*\*/) || [, nameCell])[1];
      const inst = plain(nameCell.replace(/\*\*.+?\*\*/, "")).replace(/^\(|\)$/g, "");
      const stars = (fitCell.match(/★/g) || []).length;
      const fitText = fitCell.replace(/^[★☆\s]+(—\s*)?/, "");
      const t = tierRaw.match(/\*\*(\d)(?:-(\d))?\*\*/);
      const tierNum = t ? (t[2] ? (+t[1] + +t[2]) / 2 : +t[1]) : (/bajo/i.test(tierRaw) ? 8 : 6);
      const tierLabel = t ? "T" + t[1] + (t[2] ? "–" + t[2] : "") : (/bajo/i.test(tierRaw) ? "bajo" : "—");
      const low = admCell.toLowerCase(), note = noteCell.toLowerCase(), tl = tierRaw.toLowerCase();
      let status = "recomendado";
      if (note.includes("probable descarte")) status = "descarte";
      else if (low.includes("condicional") || tl.includes("condicional")) status = "condicional";
      else if (note.includes("top prioridad")) status = "prioridad";
      const tags = [];
      if (/nuevo \(/i.test(noteCell)) tags.push({ t: "Nuevo " + ((noteCell.match(/nuevo \(([^)]+)\)/i) || [])[1] || ""), cls: "new" });
      if (/top-tier global/i.test(noteCell)) tags.push({ t: "Top-tier global" });
      if (/reach/i.test(tierRaw)) tags.push({ t: "Reach" });
      if (/safety/i.test(noteCell)) tags.push({ t: "Safety" });
      return { name: plain(name), inst, country, cc: CC[country] || country.slice(0, 2).toUpperCase(), tierRaw, tierNum, tierLabel, lang, stars, fitText, admText: admCell, noteText: noteCell, status, tags, facts: [] };
    });
  }

  function parseNotes(body) {
    const notes = [];
    let intro = "", cur = null;
    for (const line of body.split("\n")) {
      const t = line.trim();
      if (t.startsWith(">")) { intro += t.replace(/^>\s?/, "") + " "; continue; }
      const h = t.match(/^\*\*(.+)\*\*$/);
      if (h) { cur = { title: h[1], items: [] }; notes.push(cur); continue; }
      const li = t.match(/^-\s+(.*)/);
      if (li && cur) cur.items.push(li[1]);
    }
    return { intro: intro.trim(), notes };
  }

  function attachNotes(programs, notes) {
    const rest = [];
    notes.forEach((n) => {
      const key = norm(n.title);
      const p = programs.find((p) => { const k = norm(p.name); return k.startsWith(key) || key.startsWith(k); });
      if (p) p.facts = n.items; else rest.push(n);
    });
    return rest;
  }

  function parseDiscards(body) {
    const groups = [];
    let intro = "", cur = null;
    for (const line of body.split("\n")) {
      const t = line.trim();
      if (t.startsWith(">")) { intro += t.replace(/^>\s?/, "") + " "; continue; }
      const h = t.match(/^###\s+(.*)/);
      if (h) { cur = { title: h[1], items: [] }; groups.push(cur); continue; }
      const li = t.match(/^-\s+(.*)/);
      if (li && cur) {
        const txt = li[1];
        const nm = txt.match(/^\*\*(.+?)\*\*\s*(.*)$/);
        if (!nm) { cur.items.push({ name: "", meta: "", why: txt }); continue; }
        let tail = nm[2];
        let meta = "";
        const colon = tail.search(/:\s/);
        if (colon >= 0) { meta = tail.slice(0, colon); tail = tail.slice(colon + 1).trim(); }
        meta = meta.replace(/^[,\s—-]+/, "").replace(/^\((.*)\)$/, "$1").trim();
        cur.items.push({ name: nm[1], meta, why: tail });
      }
    }
    return { intro: intro.trim(), groups };
  }

  // ---------- Calendar ----------
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const CAL_START = new Date(2026, 8, 1), CAL_END = new Date(2028, 9, 15);
  const pct = (d) => Math.max(0, Math.min(100, ((d - CAL_START) / (CAL_END - CAL_START)) * 100));
  const fmt = (d) => d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  const daysTo = (d, now) => Math.ceil((d - now) / 86400000);

  function calendar(now, pslRisk) {
    let ticks = "";
    for (let i = 0; ; i += 3) {
      const d = new Date(2026, 9 + i, 1);
      if (d > CAL_END) break;
      const m = d.getMonth(), y = d.getFullYear(), isYear = m === 0;
      ticks += '<div class="tick' + (isYear ? " year" : "") + '" style="left:' + pct(d) + '%"><span>' + (isYear ? y : MONTHS[m] + " " + String(y).slice(2)) + "</span></div>";
    }
    const band = (cls, a, b, top, label) => '<div class="band ' + cls + '" style="left:' + pct(a) + "%;width:" + (pct(b) - pct(a)) + "%;top:" + top + 'px" title="' + label + '">' + label + "</div>";
    const pin = (cls, d, top, title, sub, flip) => '<div class="pin ' + cls + (flip ? " flip" : "") + '" style="' + (flip ? "right:" + (100 - pct(d)) : "left:" + pct(d)) + "%;top:" + top + 'px"><i></i><b>' + title + "</b><small>" + sub + "</small></div>";
    const todayInRange = now >= CAL_START && now <= CAL_END;
    return '<div class="cal-scroll"><div class="cal" role="img" aria-label="Calendario de septiembre 2026 a septiembre 2028 con el ciclo de aplicación y los hitos clave">' +
      ticks +
      band("apply", new Date(2027, 10, 1), new Date(2028, 3, 30), 30, "Aplicaciones · nov 27 – abr 28") +
      band("study", new Date(2027, 0, 1), new Date(2028, 5, 30), 68, "Titulación UNAM (aprox. 2027–2028)") +
      pin(pslRisk ? "risk" : "", new Date(2027, 11, 11), 112, "PSL PhD Track", "~11 dic 2027" + (pslRisk ? " · en duda" : "")) +
      pin("goal", new Date(2028, 8, 1), 112, "Entrada Fall 2028", "sep 2028", true) +
      (todayInRange ? '<div class="today" style="left:' + pct(now) + '%"><span>hoy</span></div>' : "") +
      "</div></div>";
  }

  // ---------- Render ----------
  function render(md, updated) {
    const S = sections(md);
    const s6 = S["6"].body;
    const [tablePart, notesPart = ""] = s6.split(/^###\s+6a\.[^\n]*\n/m);
    const programs = parseTable(tablePart);
    const { intro: notesIntro, notes } = parseNotes(notesPart);
    const extraNotes = attachNotes(programs, notes);
    const becas = extraNotes.find((n) => /becas/i.test(n.title));
    const discards = S["8"] ? parseDiscards(S["8"].body) : { intro: "", groups: [] };
    const alerts = (S["4"] ? S["4"].body : "").split("\n").filter((l) => l.includes("⚠️"));
    const pslRisk = alerts.some((l) => /PSL/i.test(l));

    programs.sort((a, b) => STATUS[a.status].order - STATUS[b.status].order || a.tierNum - b.tierNum || b.stars - a.stars);

    const now = new Date();
    const applyOpen = new Date(2027, 10, 1), fall = new Date(2028, 8, 1);
    const count = (st) => programs.filter((p) => p.status === st).length;
    const discardTotal = discards.groups.reduce((n, g) => n + g.items.length, 0);
    const countries = [...new Set(programs.map((p) => p.country))];

    const alertHtml = alerts.map((l) => {
      const text = l.replace(/^[-*]\s+/, "").replace(/^\*\*[^*]+\*\*\s*/, "");
      let body = text.slice(text.indexOf("⚠️")).replace(/^⚠️\s*/, "");
      if ((body.match(/\*\*/g) || []).length % 2) body = "**" + body;
      return '<div class="alert"><span class="alert-tag">Verificar</span><p>' + inline(body) + "</p></div>";
    }).join("");

    app.className = "";
    app.innerHTML =
      '<section class="hero" aria-labelledby="h1">' +
        '<span class="eyebrow">Santiago Llaguno · Entrada Fall 2028</span>' +
        '<h1 id="h1">Maestría en AI <em>×</em> psicología</h1>' +
        "<p>Portafolio vivo de programas que conectan inteligencia artificial con ciencia cognitiva, con prioridad en Cognitive Load Theory × AI y en construir con AI. Cada programa se evalúa contra los cinco criterios de inclusión.</p>" +
        '<div class="meta-line"><span>Fuente: ' + SOURCE + "</span>" + (updated ? "<span>Actualizado " + fmt(updated) + "</span>" : "") + '<span><a href="' + REPO + '" target="_blank" rel="noopener">Ver repositorio</a></span></div>' +
      "</section>" +
      '<div class="stats">' +
        stat(programs.length, "programas en la lista") +
        stat(count("prioridad") + count("recomendado"), "prioridad o recomendados") +
        stat(count("condicional"), "condicionales") +
        stat(discardTotal, "evaluados y descartados") +
        stat(Math.max(0, daysTo(applyOpen, now)), "días para abrir el ciclo (nov 2027)") +
        stat(Math.max(0, daysTo(fall, now)), "días para Fall 2028") +
      "</div>" +
      (alertHtml ? '<div class="alerts">' + alertHtml + "</div>" : "") +

      '<section id="calendario" aria-labelledby="h-cal">' +
        '<div class="sec-head"><h2 id="h-cal">Calendario</h2><p>Las solicitudes se envían en paralelo entre noviembre de 2027 y abril de 2028.</p></div>' +
        calendar(now, pslRisk) +
      "</section>" +

      '<section id="portafolio" aria-labelledby="h-port">' +
        '<div class="sec-head"><h2 id="h-port">Portafolio</h2><p>Ordenado por estado, tier y fit temático. Abre un programa para ver fuentes, deadlines y costos.</p></div>' +
        '<div class="filters">' +
          '<div class="seg" role="group" aria-label="Filtrar por estado" id="seg"></div>' +
          '<select class="field" id="country" aria-label="Filtrar por país"><option value="">Todos los países</option>' + countries.map((c) => '<option value="' + esc(c) + '">' + esc(c) + "</option>").join("") + "</select>" +
          '<input class="field" id="q" type="search" placeholder="Buscar programa, universidad o tema" aria-label="Buscar programas">' +
        "</div>" +
        '<div class="list"><div class="list-head" aria-hidden="true"><span>Programa</span><span>País</span><span>Tier</span><span>Fit</span><span>Estado</span><span></span></div><div id="rows"></div></div>' +
        (notesIntro ? '<p class="note">' + inline(notesIntro) + "</p>" : "") +
      "</section>" +

      '<section id="descartes" aria-labelledby="h-desc">' +
        '<div class="sec-head"><h2 id="h-desc">Evaluados y descartados</h2><p>' + inline(discards.intro || "Programas revisados que no entran a la lista principal.") + "</p></div>" +
        '<div class="groups" id="groups"></div>' +
      "</section>" +

      (becas ? '<section id="becas" aria-labelledby="h-becas"><div class="sec-head"><h2 id="h-becas">Becas transversales</h2><p>Aplican a varios programas del portafolio.</p></div><div class="becas">' +
        becas.items.map((i) => "<div>" + inline(i) + "</div>").join("") + "</div></section>" : "") +

      '<section id="contexto" aria-labelledby="h-ctx">' +
        '<div class="sec-head"><h2 id="h-ctx">Contexto</h2><p>Perfil, objetivo y reglas que definen qué entra al portafolio.</p></div>' +
        '<div class="ctx">' +
          ctx(S["2"]) + ctx(S["3"]) + ctx(S["4"], false, true) + ctx(S["5"]) + ctx(S["7"], true) +
        "</div>" +
      "</section>" +

      "<footer><span>Generado a partir de " + SOURCE + ". Los datos de deadlines y colegiaturas deben confirmarse en cada fuente oficial.</span><span>Fall 2028</span></footer>";

    // Interactividad del portafolio
    let state = { status: "all", country: "", q: "" };
    try { Object.assign(state, JSON.parse(localStorage.getItem("filters") || "{}")); } catch (e) {}
    const segEl = document.getElementById("seg"), rowsEl = document.getElementById("rows");
    const countryEl = document.getElementById("country"), qEl = document.getElementById("q");
    if (!countries.includes(state.country)) state.country = "";
    countryEl.value = state.country; qEl.value = state.q;
    const segOpts = [["all", "Todos", programs.length]].concat(Object.keys(STATUS).map((k) => [k, STATUS[k].label, count(k)]).filter((o) => o[2] > 0));
    if (!segOpts.some((o) => o[0] === state.status)) state.status = "all";

    function drawSeg() {
      segEl.innerHTML = segOpts.map(([k, l, n]) => '<button type="button" data-k="' + k + '" aria-pressed="' + (state.status === k) + '">' + l + ' <span class="num">' + n + "</span></button>").join("");
    }
    const hay = (p) => (p.name + " " + p.inst + " " + p.country + " " + p.fitText + " " + p.noteText + " " + p.lang).toLowerCase();
    function drawRows() {
      const q = state.q.trim().toLowerCase();
      const list = programs.filter((p) => (state.status === "all" || p.status === state.status) && (!state.country || p.country === state.country) && (!q || hay(p).includes(q)));
      rowsEl.innerHTML = list.length ? list.map(row).join("") : '<div class="empty">Ningún programa coincide con estos filtros.</div>';
    }
    function save() { try { localStorage.setItem("filters", JSON.stringify(state)); } catch (e) {} }
    segEl.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.status = b.dataset.k; drawSeg(); drawRows(); save(); });
    countryEl.addEventListener("change", () => { state.country = countryEl.value; drawRows(); save(); });
    qEl.addEventListener("input", () => { state.q = qEl.value; drawRows(); drawGroups(); save(); });

    const groupsEl = document.getElementById("groups");
    function drawGroups() {
      const q = state.q.trim().toLowerCase();
      groupsEl.innerHTML = discards.groups.map((g, i) => {
        const items = g.items.filter((it) => !q || (it.name + " " + it.meta + " " + it.why).toLowerCase().includes(q));
        if (q && !items.length) return "";
        return '<details class="group"' + (i === 0 || q ? " open" : "") + '><summary><h3>' + inline(g.title) + '</h3><span class="num">' + items.length + '</span><span class="chev" aria-hidden="true"></span></summary><ul>' +
          items.map((it) => '<li><div class="d-name">' + inline(it.name) + (it.meta ? '<span class="d-meta">' + inline(it.meta) + "</span>" : "") + '</div><div class="d-why">' + inline(it.why) + "</div></li>").join("") +
          "</ul></details>";
      }).join("") || '<div class="empty">Ningún descarte coincide con la búsqueda.</div>';
    }
    drawSeg(); drawRows(); drawGroups();
  }

  function stat(n, label) { return '<div class="stat"><b>' + n + "</b><span>" + label + "</span></div>"; }

  function row(p) {
    const meter = '<span class="meter" role="img" aria-label="Fit ' + p.stars + ' de 5">' + [1, 2, 3, 4, 5].map((i) => '<i class="' + (i <= p.stars ? "on" : "") + '"></i>').join("") + "</span>";
    return '<details class="prog"><summary>' +
      '<div class="p-name"><strong>' + esc(p.name) + '</strong><span class="inst">' + esc(p.inst) + "</span>" +
        (p.tags.length ? '<span class="tags">' + p.tags.map((t) => '<span class="tag ' + (t.cls || "") + '">' + esc(t.t.trim()) + "</span>").join("") + "</span>" : "") + "</div>" +
      '<div class="row"><span class="cc" title="' + esc(p.country) + '">' + esc(p.cc) + '</span><span class="tier' + (p.tierNum > 5 ? " low" : "") + '" title="' + esc(plain(p.tierRaw)) + '">' + esc(p.tierLabel) + "</span>" + meter +
        '<span class="pill ' + p.status + '">' + STATUS[p.status].label + "</span></div>" +
      '<span class="chev" aria-hidden="true"></span>' +
      "</summary>" +
      '<div class="p-body"><dl>' +
        "<div><dt>Fit temático</dt><dd>" + inline(p.fitText) + "</dd></div>" +
        "<div><dt>Admisión con perfil de psicología</dt><dd>" + inline(p.admText) + "</dd></div>" +
        "<div><dt>Estatus y notas</dt><dd>" + inline(p.noteText) + "</dd></div>" +
        "<div><dt>Idioma</dt><dd>" + inline(p.lang) + "</dd></div>" +
      '</dl><div class="facts"><dl><div><dt>Fuentes, deadlines y costos</dt><dd>' +
        (p.facts.length ? "<ul>" + p.facts.map((f) => "<li>" + inline(f) + "</li>").join("") + "</ul>" : '<p class="none">Sin notas detalladas todavía. Se agregan cuando la rutina de búsqueda verifica el programa.</p>') +
      "</dd></div></dl></div></div></details>";
  }

  function ctx(sec, wide, onlyPlan) {
    if (!sec) return "";
    let body = sec.body;
    if (onlyPlan) body = body.split("\n").map((l) => l.includes("⚠️") ? l.slice(0, l.indexOf("⚠️")).replace(/\*\*\s*$/, "").trim() + " (ver alerta arriba)" : l).join("\n");
    return '<article class="' + (wide ? "wide" : "") + '"><h3>' + inline(sec.title) + "</h3>" + blocks(body) + "</article>";
  }

  fetch(SOURCE, { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); const lm = r.headers.get("last-modified"); return r.text().then((t) => [t, lm ? new Date(lm) : null]); })
    .then(([md, lm]) => render(md, lm && !isNaN(lm) ? lm : null))
    .catch((err) => {
      app.className = "";
      app.innerHTML = '<div class="error"><strong>No se pudo leer ' + SOURCE + ".</strong> Sirve esta carpeta con un servidor (por ejemplo, <code>npx serve</code>) o despliégala en Vercel; abrir el archivo directamente desde el disco bloquea la lectura. Detalle: " + esc(String(err.message || err)) + "</div>";
      console.error(err);
    });
})();
</script>
</body>
</html>
